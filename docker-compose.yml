# Full stack: Linux exporter + backend.
# Exporters run on each Linux host. Backend queries Prometheus and serves the UI.
#
# Usage:
#   docker-compose up -d
#
# For ESXi exporter only (external collector):
#   docker-compose -f docker-compose.esxi-exporter.yml up -d
#
# For backend only:
#   docker-compose -f docker-compose.backend.yml up -d

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    network_mode: host
    ports:
      - "8080:8080"
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://localhost:9090}
      - CONFLUENCE_URL=${CONFLUENCE_URL:-}
      - CONFLUENCE_USERNAME=${CONFLUENCE_USERNAME:-}
      - CONFLUENCE_PASSWORD=${CONFLUENCE_PASSWORD:-}
      - CONFLUENCE_SPACE_KEY=${CONFLUENCE_SPACE_KEY:-}
      - STATE_PATH=/data/state.json
      - LISTEN_ADDR=:8080
    volumes:
      - inventory-data:/data
    restart: unless-stopped

volumes:
  inventory-data:
