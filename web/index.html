<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM Inventory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='4' fill='%23cc4718'/%3E%3Crect x='5' y='6' width='18' height='4' rx='1.5' fill='%23fff9f5'/%3E%3Crect x='5' y='12' width='18' height='4' rx='1.5' fill='%23fff9f5'/%3E%3Crect x='5' y='18' width='11' height='4' rx='1.5' fill='%23fff9f5'/%3E%3C/svg%3E">
<script>
// Resolve the theme before first paint so the page never flashes the wrong
// palette. An explicit choice wins; otherwise follow the OS.
(function () {
  var t = null;
  try { t = localStorage.getItem("inv-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="masthead" id="header">
  <div class="wrap masthead-in">
    <div class="masthead-top">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 28 24" aria-hidden="true" focusable="false">
          <rect x="1" y="2" width="26" height="6" rx="1.5"/>
          <rect x="1" y="10" width="26" height="6" rx="1.5"/>
          <rect class="brand-mark-live" x="1" y="18" width="15" height="6" rx="1.5"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">VM Inventory</span>
          <span class="brand-sub">infrastructure</span>
        </span>
      </a>

      <div class="controls">
        <div class="field field-search">
          <label for="search" class="sr-only">Search inventory</label>
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <path d="M15.7 15.7 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
          <input type="search" id="search" placeholder="Search hosts, VMs, IPs…" autocomplete="off" spellcheck="false">
        </div>
        <label class="sr-only" for="geo-filter">Filter by geo</label>
        <select id="geo-filter" onchange="onGeoFilter()"><option value="">All geos</option></select>
        <label class="sr-only" for="host-filter">Filter by host</label>
        <select id="host-filter" onchange="onHostFilter()"><option value="">All hosts</option></select>
        <button id="refresh-btn" class="btn btn-solid" type="button" onclick="doRefresh()">Refresh</button>
        <button id="publish-btn" class="btn btn-ghost" type="button" onclick="doPublish()">Publish</button>
      </div>
    </div>

    <div class="spec">
      <span class="spec-status" id="cache-status" aria-live="polite">Reading Prometheus…</span>
      <a id="confluence-link" class="spec-link" href="#" target="_blank" rel="noopener" hidden>Confluence<svg class="ico-ext" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2h6v6M10 2 4.5 7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></a>
      <button id="theme-toggle" class="btn btn-icon" type="button" aria-pressed="false" aria-label="Toggle dark theme" title="Toggle dark theme">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.2 14.4A8.3 8.3 0 0 1 9.6 3.8a8.4 8.4 0 1 0 10.6 10.6Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="rail" id="stats" aria-label="Fleet totals" hidden></section>
  <div class="state" id="loading">Reading Prometheus…</div>
  <div class="state" id="empty" hidden>No hosts currently observed — inventory appears once an exporter is scraped.</div>
  <div class="state" id="no-results" hidden>No results match the current filter.</div>
  <div id="geos"></div>
</main>

<script src="/app.js"></script>
</body>
</html>
