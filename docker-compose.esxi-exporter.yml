# ESXi exporter — single Docker image for both Linux and ESXi modes.
# The mode is determined by the YAML config, not the image.
#
# Usage:
#   1. Create config:
#        cp config/exporter-esxi.yaml.example config/esxi.yaml
#        chmod 600 config/esxi.yaml
#   2. docker-compose -f docker-compose.esxi-exporter.yml up -d
#   3. curl http://localhost:9171/metrics

version: "3.8"

services:
  exporter:
    image: ghcr.io/sshamanov/inventory-exporter:latest
    container_name: inventory-exporter
    network_mode: host
    ports:
      - "9171:9171"
    restart: unless-stopped
