# Processing backend — queries Prometheus, serves the JSON API, web UI, Confluence publisher.
#
# Usage:
#   PROMETHEUS_URL=http://prometheus:9090 \
#   CONFLUENCE_URL=https://confluence.internal \
#   CONFLUENCE_TOKEN=<personal access token> \
#   CONFLUENCE_PAGE_ID=123456 \
#   docker-compose -f docker-compose.backend.yml up -d

version: "3.8"

services:
  backend:
    image: ghcr.io/sshamanov/inventory-backend:latest
    container_name: inventory-backend
    network_mode: host
    ports:
      - "8080:8080"
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:?PROMETHEUS_URL is required}
      - CONFLUENCE_URL=${CONFLUENCE_URL:-}
      - CONFLUENCE_TOKEN=${CONFLUENCE_TOKEN:-}
      - CONFLUENCE_PAGE_ID=${CONFLUENCE_PAGE_ID:-}
    restart: unless-stopped
