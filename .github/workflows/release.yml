name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build exporter
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o bin/inventory-exporter ./cmd/inventory-exporter/

      - name: Build backend
        run: |
          go build -ldflags="-s -w" -o bin/inventory-backend ./cmd/inventory-backend/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exporter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/exporter.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:latest
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:${{ github.ref_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-backend:latest
            ${{ env.IMAGE_PREFIX }}/inventory-backend:${{ github.ref_name }}

      - name: Upload binaries to file service
        if: ${{ env.FILESERVICE_URL != '' }}
        env:
          FILESERVICE_TOKEN: ${{ secrets.FILESERVICE_TOKEN }}
        run: |
          upload() {
            local name="$1"
            local file="$2"
            local desc="$3"
            local file_hash=$(sha256sum "$file" | cut -d' ' -f1)
            local b64=$(base64 -w0 "$file")

            curl -fsS -X POST \
              -H "Authorization: Bearer ${FILESERVICE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc \
                --arg name      "$name" \
                --arg version   "${{ github.ref_name }}" \
                --arg file_hash "sha256:$file_hash" \
                --arg commit    "${{ github.sha }}" \
                --arg source    "${{ github.server_url }}/${{ github.repository }}" \
                --arg desc      "$desc" \
                --argjson run  ${{ github.run_number }} \
                --arg b64       "$b64" \
                '{name: $name, version: $version, run: $run, file_hash: $file_hash, commit: $commit, source: $source, description: $desc, binary: $b64}')" \
              "${FILESERVICE_URL}" || echo "WARN: upload of $name failed"

            echo "Uploaded $name sha256:$file_hash commit:${{ github.sha }}"
          }

          upload "inventory-exporter" bin/inventory-exporter \
            "Infrastructure inventory exporter binary for Linux AMD64"

          upload "inventory-backend" bin/inventory-backend \
            "Processing backend — Prometheus queries, JSON API, web UI, Confluence publisher"
