name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  FILESERVICE_URL: ${{ vars.FILESERVICE_URL }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build exporter
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o bin/inventory-exporter ./cmd/inventory-exporter/

      - name: Build backend
        run: |
          go build -ldflags="-s -w" -o bin/inventory-backend ./cmd/inventory-backend/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exporter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/exporter.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:latest
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:${{ github.ref_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-backend:latest
            ${{ env.IMAGE_PREFIX }}/inventory-backend:${{ github.ref_name }}

      - name: Upload binaries to file service
        if: ${{ env.FILESERVICE_URL != '' }}
        env:
          FILESERVICE_TOKEN: ${{ secrets.FILESERVICE_TOKEN }}
        run: |
          upload() {
            local name="$1"
            local file="$2"
            local desc="$3"
            local file_hash=$(sha256sum "$file" | cut -d' ' -f1)

            curl -fsS -X POST "${FILESERVICE_URL}" \
              -H "Authorization: Bearer ${FILESERVICE_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "X-Package-Name: ${name}" \
              -H "X-Package-Version: ${{ github.ref_name }}" \
              -H "X-Package-Hash: sha256:${file_hash}" \
              -H "X-Package-Commit: ${{ github.sha }}" \
              -H "X-Package-Source: ${{ github.server_url }}/${{ github.repository }}" \
              -H "X-Package-Description: ${desc}" \
              -H "X-Package-Run: ${{ github.run_number }}" \
              --data-binary "@${file}" \
              || echo "WARN: upload of $name failed"

            echo "Uploaded $name sha256:$file_hash run:${{ github.run_number }}"
          }

          upload "inventory-exporter" bin/inventory-exporter \
            "Infrastructure inventory exporter binary for Linux AMD64"

          upload "inventory-backend" bin/inventory-backend \
            "Processing backend — Prometheus queries, JSON API, web UI, Confluence publisher"
