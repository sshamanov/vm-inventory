name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build exporter
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o bin/inventory-exporter ./cmd/inventory-exporter/

      - name: Build backend
        run: |
          go build -ldflags="-s -w" -o bin/inventory-backend ./cmd/inventory-backend/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/inventory-exporter
            bin/inventory-backend
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exporter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/exporter.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:latest
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:${{ github.ref_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-backend:latest
            ${{ env.IMAGE_PREFIX }}/inventory-backend:${{ github.ref_name }}
