name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - run: go vet ./...
      - run: go test ./... -count=1 -race

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build exporter
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o bin/inventory-exporter ./cmd/inventory-exporter/

      - name: Build backend
        run: |
          go build -ldflags="-s -w" -o bin/inventory-backend ./cmd/inventory-backend/

      - name: Upload exporter binary
        uses: actions/upload-artifact@v4
        with:
          name: inventory-exporter
          path: bin/inventory-exporter

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: inventory-backend
          path: bin/inventory-backend

  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exporter binary
        uses: actions/download-artifact@v4
        with:
          name: inventory-exporter
          path: bin/

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: inventory-backend
          path: bin/

      - name: Make binaries executable
        run: chmod +x bin/*

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exporter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/exporter.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:latest
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-backend:latest
            ${{ env.IMAGE_PREFIX }}/inventory-backend:${{ github.sha }}

      - name: Push exporter binary to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/bin.Dockerfile
          build-args: BINARY=inventory-exporter
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:latest-bin
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:${{ github.sha }}-bin

      - name: Push backend binary to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/bin.Dockerfile
          build-args: BINARY=inventory-backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-backend:latest-bin
            ${{ env.IMAGE_PREFIX }}/inventory-backend:${{ github.sha }}-bin
