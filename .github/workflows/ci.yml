name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  FILESERVICE_URL: ${{ vars.FILESERVICE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build exporter
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X vm-inventory/internal/version.Version=main -X vm-inventory/internal/version.Commit=$COMMIT" \
            -o bin/inventory-exporter ./cmd/inventory-exporter/

      - name: Build backend
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          CGO_ENABLED=0 go build -ldflags="-s -w -X vm-inventory/internal/version.Version=main -X vm-inventory/internal/version.Commit=$COMMIT" \
            -o bin/inventory-backend ./cmd/inventory-backend/

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exporter image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/exporter.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:latest
            ${{ env.IMAGE_PREFIX }}/inventory-exporter:${{ github.sha }}
          cache-from: type=gha,scope=exporter
          cache-to: type=gha,scope=exporter,mode=min

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/inventory-backend:latest
            ${{ env.IMAGE_PREFIX }}/inventory-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=min

      - name: Upload binaries to file service
        if: ${{ github.event_name == 'push' && env.FILESERVICE_URL != '' }}
        env:
          FILESERVICE_TOKEN: ${{ secrets.FILESERVICE_TOKEN }}
        run: |
          upload() {
            local name="$1"
            local file="$2"
            local desc="$3"
            local file_hash=$(sha256sum "$file" | cut -d' ' -f1)

            curl -fsS -X POST "${FILESERVICE_URL}" \
              -H "Authorization: Bearer ${FILESERVICE_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "X-Package-Name: ${name}" \
              -H "X-Package-Version: ${{ github.sha }}" \
              -H "X-Package-Hash: sha256:${file_hash}" \
              -H "X-Package-Commit: ${{ github.sha }}" \
              -H "X-Package-Source: ${{ github.server_url }}/${{ github.repository }}" \
              -H "X-Package-Description: ${desc}" \
              -H "X-Package-Run: ${{ github.run_number }}" \
              --data-binary "@${file}" \
              || echo "WARN: upload of $name failed"

            echo "Uploaded $name sha256:$file_hash run:${{ github.run_number }}"
          }

          upload "inventory-exporter" bin/inventory-exporter \
            "Infrastructure inventory exporter binary for Linux AMD64"

          upload "inventory-backend" bin/inventory-backend \
            "Processing backend — Prometheus queries, JSON API, web UI, Confluence publisher"

          upload "inventory-exporter-deploy" config/deploy.sh \
            "Self-contained deployment script — installs exporter + systemd units"
